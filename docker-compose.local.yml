services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: brackeroni
      POSTGRES_USER: brackeroni
      # Local-development credential only. It is not used by Neon or production.
      POSTGRES_PASSWORD: brackeroni_local_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - brackeroni-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brackeroni -d brackeroni"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  brackeroni-local-postgres-data:
